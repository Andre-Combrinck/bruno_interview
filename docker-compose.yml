services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bruno_hire
      POSTGRES_USER: bruno
      POSTGRES_PASSWORD: bruno_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bruno -d bruno_hire"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Bruno.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=bruno_hire;Username=bruno;Password=bruno_dev_password
      ApiKey: bruno-dev-api-key
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_API_KEY: bruno-dev-api-key
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
